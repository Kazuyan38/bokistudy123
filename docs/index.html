<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1B2A4A">
<title>BokiStudy — 簿記2級への道</title>
<meta name="description" content="日商簿記2級合格を目指す、学習科学ベースの独学アプリ">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Zen+Old+Mincho:wght@600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%231B2A4A'/%3E%3Ctext x='50' y='68' font-size='52' text-anchor='middle' fill='%23C89B3C' font-family='serif' font-weight='bold'%3E簿%3C/text%3E%3C/svg%3E">
</head>
<body>
<div id="app" class="app">
  <main id="screen" class="screen" aria-live="polite"></main>

  <nav class="tabbar" id="tabbar" aria-label="メインナビゲーション">
    <a href="#home" data-tab="home" class="tab">
      <svg viewBox="0 0 24 24" class="tab-icon"><path d="M4 11.5 12 4l8 7.5V20a1 1 0 0 1-1 1h-4.5v-5.5h-5V21H5a1 1 0 0 1-1-1v-8.5Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
      <span>ホーム</span>
    </a>
    <a href="#map" data-tab="map" class="tab">
      <svg viewBox="0 0 24 24" class="tab-icon"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3V4Z" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M5 4v13a3 3 0 0 0 3 3M9 8.5h6M9 12h6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"/></svg>
      <span>学習</span>
    </a>
    <a href="#review" data-tab="review" class="tab">
      <svg viewBox="0 0 24 24" class="tab-icon"><path d="M4 9a8 8 0 0 1 14.9-2M20 15a8 8 0 0 1-14.9 2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M18.5 3.5V7H15M5.5 20.5V17H9" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>復習</span>
    </a>
    <a href="#stats" data-tab="stats" class="tab">
      <svg viewBox="0 0 24 24" class="tab-icon"><path d="M4 20V10M10 20V4M16 20v-7M21 20H3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <span>分析</span>
    </a>
    <a href="#settings" data-tab="settings" class="tab">
      <svg viewBox="0 0 24 24" class="tab-icon"><circle cx="12" cy="12" r="3.2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 2.8v2.5M12 18.7v2.5M2.8 12h2.5M18.7 12h2.5M5.5 5.5l1.8 1.8M16.7 16.7l1.8 1.8M18.5 5.5l-1.8 1.8M7.3 16.7l-1.8 1.8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <span>設定</span>
    </a>
  </nav>

  <button id="calc-fab" class="calc-fab" aria-label="電卓を開く" hidden>
    <svg viewBox="0 0 24 24"><rect x="4" y="2.5" width="16" height="19" rx="3" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="7" y="5.5" width="10" height="4" rx="1" fill="currentColor"/><circle cx="8.5" cy="13" r="1.2" fill="currentColor"/><circle cx="12" cy="13" r="1.2" fill="currentColor"/><circle cx="15.5" cy="13" r="1.2" fill="currentColor"/><circle cx="8.5" cy="17" r="1.2" fill="currentColor"/><circle cx="12" cy="17" r="1.2" fill="currentColor"/><circle cx="15.5" cy="17" r="1.2" fill="currentColor"/></svg>
  </button>
  <div id="calc-sheet" class="calc-sheet" hidden></div>

  <div id="numpad" class="numpad" hidden></div>
  <div id="toast" class="toast" hidden></div>
  <div id="overlay" class="overlay" hidden></div>
</div>
<script type="module" src="js/app.js"></script>
</body>
</html>
